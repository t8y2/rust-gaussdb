[package]
name = "rust-gaussdb"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight native GaussDB/openGauss client for Rust with SHA256 SASL authentication"
repository = "https://github.com/t8y2/rust-gaussdb"
keywords = ["gaussdb", "opengauss", "postgres", "database"]
categories = ["database"]

[dependencies]
postgres-protocol = "0.6"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
byteorder = "1"
futures-util = { version = "0.3", features = ["sink"] }
futures-channel = "0.3"
fallible-iterator = "0.2"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
log = "0.4"
phf = "0.11"
serde = { version = "1", features = ["derive"], optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
